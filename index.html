<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA Manifest & Theme -->
<meta name="theme-color" content="#37C6BA">
<title>✈️ LetsFly</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&family=Heebo:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<!-- MarkerCluster CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- MarkerCluster JS -->
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{
  --bg:#0E2328;--bg2:#15323A;--bg3:#1C3F47;--bg4:#245059;
  --border:rgba(237,244,242,0.09);--border2:rgba(237,244,242,0.17);
  --accent:#37C6BA;--accent2:#1E8F86;--accentg:linear-gradient(135deg,#37C6BA,#1E8F86);
  --green:#3DD68C;--gold:#F2B33D;--coral:#FF5C5C;--purple:#8b8fe8;--rust:#FF7A52;
  --text:#EDF4F2;--textm:#93B0AC;--textd:#547371;
  --nav-h:58px;--r:14px;--rsm:9px;--shadow:0 4px 24px rgba(0,0,0,0.4);
  --mono:'JetBrains Mono',monospace;
}
body.light{
  --bg:#F7F2E7;--bg2:#FFFFFF;--bg3:#EFE7D3;--bg4:#E4D9BC;
  --border:rgba(23,43,41,0.08);--border2:rgba(23,43,41,0.16);
  --accent:#0E7C74;--accent2:#0A5B55;--accentg:linear-gradient(135deg,#0E7C74,#0A5B55);
  --green:#12905F;--gold:#B9791A;--coral:#D6432F;--purple:#6B65C9;--rust:#D6491F;
  --text:#172B29;--textm:#4C6864;--textd:#8CA29E;--shadow:0 4px 24px rgba(23,43,41,0.1);
}
body{font-family:'Rubik','Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
body[dir="rtl"]{font-family:'Heebo','Rubik',sans-serif}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:5px}

/* LOADING */
#loading{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.spinner{width:40px;height:40px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-logo{font-size:28px;font-weight:800;background:var(--accentg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:500;height:var(--nav-h);background:rgba(14,35,40,0.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:8px}
body.light nav{background:rgba(247,242,231,0.92)}
body.nav-locked nav{padding-inline-start:252px;transition:padding .25s ease}
.nav-logo{font-size:22px;font-weight:800;letter-spacing:-.5px;background:var(--accentg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;cursor:pointer;white-space:nowrap}
.nav-trip-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.nav-sections{display:none}
.nav-right{margin-inline-start:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accentg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0}
.lang-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:100px;padding:5px 10px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;color:var(--textm);transition:all .2s;white-space:nowrap}
.lang-btn:hover{border-color:var(--accent);color:var(--accent)}

/* AUTH */
#auth-screen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 15% 20%,rgba(55,198,186,.14) 0%,transparent 55%),radial-gradient(ellipse at 85% 75%,rgba(255,122,82,.09) 0%,transparent 55%),var(--bg)}
#auth-screen.show{display:flex}
.auth-box{width:100%;max-width:400px;background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:40px 36px;box-shadow:var(--shadow);animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.auth-logo{font-size:32px;font-weight:800;letter-spacing:-1px;background:var(--accentg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.auth-tagline{font-size:13px;color:var(--textm);margin-bottom:28px}
.auth-tabs{display:flex;gap:3px;background:var(--bg3);border-radius:var(--rsm);padding:3px;margin-bottom:24px}
.auth-tab{flex:1;padding:8px;border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--textm);border-radius:7px;cursor:pointer;transition:all .2s}
.auth-tab.active{background:var(--bg4);color:var(--text)}
.auth-alert{border-radius:var(--rsm);padding:10px 14px;font-size:13px;margin-bottom:12px;display:none}
.auth-err{background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.25);color:var(--coral)}
.auth-ok{background:rgba(61,214,140,.1);border:1px solid rgba(61,214,140,.25);color:var(--green)}

/* INPUTS & BUTTONS */
.inp{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rsm);padding:11px 14px;font-family:inherit;font-size:14px;color:var(--text);outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:14px;font-weight:600;padding:11px 22px;border-radius:100px;border:none;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accentg);color:#fff;width:100%}
.btn-primary:hover{opacity:.88;transform:translateY(-1px);box-shadow:0 6px 20px rgba(55,198,186,.35)}
.btn-google{width:100%;background:var(--bg3);border:1.5px solid var(--border2);color:var(--text);margin-bottom:6px}
.btn-outline{background:transparent;border:1.5px solid var(--border2);color:var(--textm)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-ghost{background:transparent;border:none;color:var(--textm);font-size:13px;padding:8px 12px}
.btn-danger{background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.25);color:var(--coral)}
.btn-sm{padding:7px 14px;font-size:12px}
.divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--textd);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* APP LAYOUT */
#app{display:none;padding-top:var(--nav-h);min-height:100vh;transition:margin .25s ease}
.page{display:none;padding:24px 20px 80px;max-width:900px;margin:0 auto;animation:fadeUp .2s ease}
.page.active{display:block}
.page-header{margin-bottom:20px}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--textm)}

/* TRIPS GRID */
.trips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px 16px}
.trip-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:visible;cursor:pointer;transition:all .2s;position:relative}
.trip-card:hover{border-color:rgba(55,198,186,.4);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.3)}
.trip-cover{height:92px;display:flex;align-items:center;justify-content:center;font-size:42px;position:relative;border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.trip-cover-bg{position:absolute;inset:0;background:linear-gradient(135deg,var(--c1),var(--c2));opacity:.85}
.trip-cover-emoji{position:relative;z-index:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
.trip-card-body{padding:16px 15px 14px}
.trip-card-name{font-size:16px;font-weight:800;margin-bottom:6px}
.trip-card-meta{font-family:var(--mono);font-size:10.5px;color:var(--textm);margin-bottom:10px}

/* CARD & MODAL */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:800;margin-bottom:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:11px;border-bottom:1px solid var(--border)}
.overlay{display:none;position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.65);backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:26px;animation:fadeUp .25s ease}
.modal-title{font-size:18px;font-weight:800;margin-bottom:20px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg4);border:1px solid var(--border2);color:var(--text);padding:10px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:9000;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

/* SIDEBAR & NAV */
.side-nav{position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:485;width:240px;background:var(--bg2);border-inline-end:1px solid var(--border);transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;overflow:hidden}
body[dir="rtl"] .side-nav{transform:translateX(100%)}
.side-nav.open{transform:translateX(0)}
body.nav-locked .side-nav{transform:translateX(0)!important}
body.nav-locked #app{margin-inline-start:240px;transition:margin .25s ease}
.side-nav-header{height:58px;display:flex;align-items:center;padding:0 16px;gap:10px;border-bottom:1px solid var(--border)}
.side-nav-logo{font-size:18px;font-weight:800;background:var(--accentg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;flex:1}
.lock-btn{background:none;border:1px solid var(--border2);border-radius:var(--rsm);width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--textd)}
.lock-btn.locked{border-color:var(--accent);color:var(--accent);background:rgba(55,198,186,.1)}
.snb{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;border-inline-start:3px solid transparent;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;color:var(--textm);padding:9px 12px;border-radius:var(--rsm);text-align:start;margin-bottom:1px}
.snb:hover{background:var(--bg3);color:var(--text)}
.snb.active{background:rgba(55,198,186,.12);color:var(--accent);font-weight:700;border-inline-start-color:var(--accent)}
.snb-icon{font-size:17px;width:22px;text-align:center}
.hamburger-btn{background:none;border:none;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--textm);border-radius:var(--rsm)}
.hamburger-btn:hover{background:var(--bg3);color:var(--text)}
body.nav-locked .hamburger-btn{display:none!important}

/* SMART BUILDER */
.stb-pace-card{position:relative;flex:1;min-width:100px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px;border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;background:var(--bg3)}
.stb-pace-card input{position:absolute;opacity:0;pointer-events:none}
.stb-pace-card:has(input:checked){border-color:var(--accent);background:rgba(55,198,186,.12)}
</style>
</head>
<body>

<div id="loading"><div class="loading-logo">✈️ LetsFly</div><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">✈️ LetsFly</div>
    <div class="auth-tagline" data-t="tagline">Plan smarter. Fly better.</div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
      <button class="lang-btn" onclick="toggleLang()" id="auth-lang-btn">🌐 עברית</button>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')" data-t="signIn">Sign In</button>
      <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')" data-t="createAccount">Create Account</button>
    </div>
    <div class="auth-alert auth-err" id="auth-err"></div>
    <div class="auth-alert auth-ok" id="auth-ok"></div>
    <button class="btn btn-google" onclick="googleLogin()">
      <svg width="17" height="17" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span data-t="continueGoogle">Continue with Google</span>
    </button>
    <div class="divider"><span data-t="orEmail">or with email</span></div>
    <div id="form-login">
      <div class="field"><div class="field-label" data-t="email">Email</div><input class="inp" id="l-email" type="email" placeholder="you@example.com"></div>
      <div class="field"><div class="field-label" data-t="password">Password</div><input class="inp" id="l-pass" type="password" placeholder="••••••••"></div>
      <button class="btn btn-primary" onclick="doLogin()"><span data-t="signIn">Sign In</span> →</button>
    </div>
    <div id="form-signup" style="display:none">
      <div class="field"><div class="field-label" data-t="fullName">Full Name</div><input class="inp" id="s-name" type="text" placeholder="Your name"></div>
      <div class="field"><div class="field-label" data-t="email">Email</div><input class="inp" id="s-email" type="email" placeholder="you@example.com"></div>
      <div class="field"><div class="field-label" data-t="password">Password</div><input class="inp" id="s-pass" type="password" placeholder="Min 6 characters"></div>
      <button class="btn btn-primary" onclick="doSignup()"><span data-t="createAccount">Create Account</span> →</button>
    </div>
  </div>
</div>

<!-- NAVBAR -->
<nav id="navbar" style="display:none">
  <button class="hamburger-btn" id="hamburger-btn" onclick="openSideNav()">☰</button>
  <div class="nav-trip-name" id="nav-trip-name"></div>
  <div class="nav-right">
    <button class="hamburger-btn" id="navbar-pin-btn" onclick="toggleNavLock()" title="Pin sidebar">📌</button>
    <span id="save-ind" style="font-size:11px;color:var(--textm);display:none">💾</span>
  </div>
</nav>

<!-- SIDE NAV -->
<div class="side-nav" id="side-nav">
  <div class="side-nav-header">
    <div class="side-nav-logo" onclick="goHome();closeSideNav()">✈️ LetsFly</div>
    <button class="lock-btn" id="lock-btn" onclick="toggleNavLock()">📌</button>
  </div>
  <div class="side-nav-items" id="side-nav-items" style="padding:10px;flex:1;overflow-y:auto"></div>
  <div style="padding:10px;border-top:1px solid var(--border)">
    <button class="snb" onclick="toggleLang()"><span class="snb-icon">🌐</span><span id="side-lang-label">עברית</span></button>
    <button class="snb" onclick="toggleTheme()"><span class="snb-icon" id="side-theme-icon">🌙</span><span id="side-theme-label">Dark mode</span></button>
    <button class="snb" onclick="doLogout()" style="color:var(--coral)"><span class="snb-icon">🚪</span>Sign Out</button>
  </div>
</div>

<!-- APP PAGES -->
<div id="app">
  <div class="page active" id="page-home">
    <div class="page-header">
      <div class="page-title" id="home-title">My Trips</div>
      <div class="page-sub" data-t="homeSubtitle">Plan, organize and share your adventures</div>
    </div>
    <div class="trips-grid" id="trips-grid"></div>
  </div>
  <div class="page" id="page-trip"></div>
</div>

<!-- MODAL -->
<div class="overlay" id="modal-new">
  <div class="modal">
    <div class="modal-title" data-t="newTrip">✈️ New Trip</div>
    <div class="field"><div class="field-label" data-t="tripName">Trip Name *</div><input class="inp" id="nt-name" placeholder="e.g. Thailand 2026"></div>
    <div class="grid2">
      <div class="field"><div class="field-label" data-t="startDate">Start Date *</div><input class="inp" id="nt-start" type="date"></div>
      <div class="field"><div class="field-label" data-t="endDate">End Date *</div><input class="inp" id="nt-end" type="date"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-new')">Cancel</button>
      <button class="btn btn-primary" onclick="createTrip()">Create Trip</button>
    </div>
  </div>
</div>

<script>
const SB_URL='https://peqseinicyynggnqnimc.supabase.co';
const SB_KEY='sb_publishable_KEcpcc9mptTU3ydvH_LvhQ_x-6-uNun';
const sb=supabase.createClient(SB_URL,SB_KEY);

let currentUser=null, currentTrip=null, tripData={}, currentSec='dashboard';
let lang=localStorage.getItem('lf-lang')||'en';
let theme=localStorage.getItem('lf-theme')||'dark';
let navLocked=localStorage.getItem('lf-nav-locked')==='1';

const T={
  en:{tagline:'Plan smarter. Fly better.',signIn:'Sign In',createAccount:'Create Account',continueGoogle:'Continue with Google',orEmail:'or with email',email:'Email',password:'Password',fullName:'Full Name',myTrips:'My Trips',signOut:'Sign Out',homeSubtitle:'Plan, organize and share your adventures',newTrip:'✈️ New Trip',tripName:'Trip Name *',startDate:'Start Date *',endDate:'End Date *',secDashboard:'Dashboard',secItinerary:'Itinerary',secBudget:'Budget'},
  he:{tagline:'תכנן חכם. טוס טוב יותר.',signIn:'כניסה',createAccount:'צור חשבון',continueGoogle:'המשך עם Google',orEmail:'או עם אימייל',email:'אימייל',password:'סיסמה',fullName:'שם מלא',myTrips:'הטיולים שלי',signOut:'התנתקות',homeSubtitle:'תכנן, ארגן ושתף את ההרפתקאות שלך',newTrip:'✈️ טיול חדש',tripName:'שם הטיול *',startDate:'תאריך יציאה *',endDate:'תאריך חזרה *',secDashboard:'דשבורד',secItinerary:'לו"ז',secBudget:'תקציב'}
};
const t=k=>(T[lang]&&T[lang][k])||T.en[k]||k;

function applyLang(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='he'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.getAttribute('data-t')));
  localStorage.setItem('lf-lang',lang);
}
function toggleLang(){lang=lang==='en'?'he':'en';applyLang();if(currentUser)loadTrips();}
function applyTheme(){document.body.classList.toggle('light',theme==='light');localStorage.setItem('lf-theme',theme);}
function toggleTheme(){theme=theme==='dark'?'light':'dark';applyTheme();}

async function init(){
  applyTheme();applyLang();
  const{data:{session}}=await sb.auth.getSession();
  if(session){currentUser=session.user;showApp();}else{showAuth();}
}
function showAuth(){
  document.getElementById('loading').style.display='none';
  document.getElementById('auth-screen').classList.add('show');
  document.getElementById('navbar').style.display='none';
  document.getElementById('app').style.display='none';
}
function showApp(){
  document.getElementById('loading').style.display='none';
  document.getElementById('auth-screen').classList.remove('show');
  document.getElementById('navbar').style.display='flex';
  document.getElementById('app').style.display='block';
  applySideNavLock();
  goHome();
}
function toggleNavLock(){
  navLocked=!navLocked;
  localStorage.setItem('lf-nav-locked',navLocked?'1':'0');
  applySideNavLock();
}
function applySideNavLock(){
  document.body.classList.toggle('nav-locked',navLocked);
  document.getElementById('lock-btn')?.classList.toggle('locked',navLocked);
}
function openSideNav(){document.getElementById('side-nav').classList.add('open');}
function closeSideNav(){if(!navLocked)document.getElementById('side-nav').classList.remove('open');}
function goHome(){
  currentTrip=null;tripData={};
  document.getElementById('nav-trip-name').textContent='';
  document.getElementById('side-nav-items').innerHTML=`<button class="snb" onclick="goHome()"><span class="snb-icon">🏠</span>My Trips</button>`;
  showPage('page-home');
  loadTrips();
}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');}

async function loadTrips(){
  const{data}=await sb.from('trips').select('*').eq('user_id',currentUser.id);
  const grid=document.getElementById('trips-grid');
  grid.innerHTML=`<div class="trip-card" onclick="openNewTripModal()" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:160px;border:2px dashed var(--border2);background:transparent">
    <div style="font-size:32px;margin-bottom:6px">➕</div><div style="font-weight:700;font-size:14px">${t('newTrip')}</div>
  </div>`;
  (data||[]).forEach(trip=>{
    grid.innerHTML+=`<div class="trip-card" onclick='openTrip(${JSON.stringify(trip)})'>
      <div class="trip-cover" style="background:var(--accentg);color:#fff">${trip.emoji||'✈️'}</div>
      <div class="trip-card-body">
        <div class="trip-card-name">${esc(trip.name)}</div>
        <div class="trip-card-meta">${trip.start_date||''} → ${trip.end_date||''}</div>
      </div>
    </div>`;
  });
}

function openNewTripModal(){document.getElementById('modal-new').classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
async function createTrip(){
  const name=document.getElementById('nt-name').value.trim();
  const start=document.getElementById('nt-start').value;
  const end=document.getElementById('nt-end').value;
  if(!name||!start||!end)return alert('Fill required fields');
  const{data,error}=await sb.from('trips').insert({user_id:currentUser.id,name,emoji:'🌴',start_date:start,end_date:end,data:{}}).select().single();
  if(!error&&data){closeModal('modal-new');openTrip(data);}
}

function openTrip(trip){
  currentTrip=trip;tripData=trip.data||{};
  document.getElementById('nav-trip-name').textContent=trip.emoji+' '+trip.name;
  document.getElementById('side-nav-items').innerHTML=`
    <button class="snb" onclick="goHome()"><span class="snb-icon">🏠</span>${t('myTrips')}</button>
    <button class="snb" onclick="showSec('dashboard')"><span class="snb-icon">📊</span>${t('secDashboard')}</button>
    <button class="snb" onclick="showSec('itinerary')"><span class="snb-icon">📅</span>${t('secItinerary')}</button>
  `;
  showPage('page-trip');
  showSec('dashboard');
}

function showSec(sec){
  currentSec=sec;
  const el=document.getElementById('page-trip');
  if(sec==='dashboard') el.innerHTML=`<div class="page-title">${currentTrip.name}</div><div class="card">Welcome to your dashboard! Start planning from the sidebar.</div>`;
  if(sec==='itinerary') el.innerHTML=`<div class="page-title">Itinerary</div><div class="card">Itinerary modules loaded successfully.</div>`;
}

async function doLogin(){
  const email=document.getElementById('l-email').value;
  const pass=document.getElementById('l-pass').value;
  const{error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error)alert(error.message);
}
async function doSignup(){
  const name=document.getElementById('s-name').value;
  const email=document.getElementById('s-email').value;
  const pass=document.getElementById('s-pass').value;
  const{error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
  if(error)alert(error.message);else alert('Check email to confirm account');
}
async function googleLogin(){await sb.auth.signInWithOAuth({provider:'google'});}
async function doLogout(){await sb.auth.signOut();location.reload();}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';}

init();
</script>
</body>
</html>
